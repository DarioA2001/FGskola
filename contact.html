<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chainsaw Club | Contact</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="header">
  <a class="logo" href="index.html">
    <span class="logo-icon">CS</span>
    <span>CHAINSAW<br><b>CLUB</b></span>
  </a>

  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="characters.html">Characters</a>
    <a href="guide.html">Guide</a>
    <a class="active" href="contact.html">Contact</a>
  </nav>
</header>

<main class="page">

  <section class="title">
    <p class="red">Contact us</p>
    <h1>Say hello</h1>
    <p>Want to talk about Chainsaw Man? Send us a message.</p>
  </section>

  <section class="contact">

    <div class="contact-info">
      <img src="Images/anime-poster.png" alt="Chainsaw Man anime poster">

      <h2>Let's talk about <em>devils.</em></h2>

      <p>
        You can send us a message if you have a question or
        want to share your favorite character.
      </p>

      <div class="email">
        <p>EMAIL</p>
        <strong>hello@chainsawclub.example</strong>
      </div>
    </div>

    <form class="form" action="mailto:hello@chainsawclub.example" method="post" enctype="text/plain">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="7" placeholder="Write something..." required></textarea>

      <button class="button" type="submit">Send message</button>

    </form>

  </section>

</main>

<footer class="footer">
  <span>CHAINSAW CLUB</span>
  <span>Fan page</span>
</footer>

</body>
</html>
